name: "Terminal Interaktif via PAT"

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}   # 🔑 Pakai PAT dari secrets
          persist-credentials: true

      - name: Setup Python (opsional)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Buka tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 60
