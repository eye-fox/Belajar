name: "Web Terminal"

on:
  workflow_dispatch:

jobs:
  web-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Install tmate
        run: |
          curl -fsSL https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz | tar xJ
          sudo mv tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/

      - name: Jalankan tmate
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "SSH connection string:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo ""
          echo "Web URL (bisa di browser):"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          sleep 3600  # Runner hidup selama 1 jam
